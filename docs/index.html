<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASVZ Stats</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>ASVZ Stats</h1>
    <p class="subtitle">Occupancy across ASVZ sports facilities</p>
    <p id="last-updated"></p>
  </header>

  <main>
    <!-- Main view: sport cards grid -->
    <div id="view-cards">
      <div id="cards-grid" class="cards-grid"></div>
    </div>

    <!-- Detail view: sport drill-down with facility charts -->
    <div id="view-detail" class="hidden">
      <button id="back-btn" class="back-btn">&larr; Back</button>
      <h2 id="detail-sport-name"></h2>
      <div id="detail-facilities"></div>
    </div>
  </main>

  <footer>
    <p>Data collected every 30 min from the <a href="https://asvz.ch" target="_blank">ASVZ</a> public API. <a href="https://github.com/Darkroom4364/ASVZ-Stats" target="_blank">Source</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
